name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: -race
          # windows-latest has no C compiler, and -race needs one.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Library
        run: |
          go vet ./...
          go test -count=1 ${{ matrix.race }} ./...
          go build ./...
      - name: PTY end-to-end
        working-directory: tools/ptycheck
        run: |
          go vet ./...
          go test -count=1 ${{ matrix.race }} ./...
